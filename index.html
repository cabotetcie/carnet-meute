<style>
:root{
  --bg:#FAEDCD;--surface:#FFF8E6;--surface-2:#F2E2BA;--ink:#283618;--muted:#5F6A4B;--line:#E2D0A2;
  --accent:#283618;--accent-ink:#FAEDCD;--accent-soft:#E6E2BF;--link:#0F00B7;--bar:#0F00B7;

    --accent:#FAEDCD;--accent-ink:#283618;--accent-soft:#34421F;--link:#A9A2FF;--bar:#8F86FF;
    --warn:#E7B35C;--warn-soft:#3A2E14;--bad:#E8796C;--bad-soft:#3E1A14;--good:#B9D08A;--good-soft:#2A3A18;
    --c1:#8F86FF;--c2:#E8796C;--c3:#B9D08A;--c4:#E7B35C;--c5:#E08BC4;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1A2310;--surface:#232E16;--surface-2:#2D3A1D;--ink:#FAEDCD;--muted:#C4B892;--line:#3A4829;
  --accent:#FAEDCD;--accent-ink:#283618;--accent-soft:#34421F;--link:#A9A2FF;--bar:#8F86FF;
  --warn:#E7B35C;--warn-soft:#3A2E14;--bad:#E8796C;--bad-soft:#3E1A14;--good:#B9D08A;--good-soft:#2A3A18;
  --c1:#8F86FF;--c2:#E8796C;--c3:#B9D08A;--c4:#E7B35C;--c5:#E08BC4;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:10px 120px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}

.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:8px 14px}
.brand{font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sync.local i{background:var(--warn)}

section.block{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
button.card{font:inherit;color:inherit;text-align:left}
.card.muted-card{background:transparent;box-shadow:none;border-style:dashed}
.who{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.88rem}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--ink)}
.pill.ex{background:transparent;border:1px dashed var(--line)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;font-size:.92rem;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:.84rem}
.btn.block{width:100%}
.linkbtn{background:none;border:0;padding:0;text-align:left;color:var(--link);font-weight:700;font-size:.88rem;text-decoration:underline;text-underline-offset:3px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:36px}

.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}

.pct{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}

.advice{border-radius:12px;padding:10px 12px;font-size:.92rem;background:var(--accent-soft);color:var(--ink)}

.advice b{color:var(--link)} .advice.warn b{color:var(--warn)} .advice.good b{color:var(--good)} .advice.muted b{color:var(--muted)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted)}
.week button strong{font-family:var(--display);font-size:1.05rem;color:var(--ink)}
.week button.on{border-color:var(--accent);background:var(--accent-soft)}
.dots{display:flex;gap:2px;min-height:7px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.dots i.o{background:transparent!important;box-shadow:inset 0 0 0 1.5px currentColor}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:.7rem;text-align:center;color:var(--muted);font-weight:700;padding-bottom:2px}
.cal button{aspect-ratio:1/1.05;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:5px 0;font-variant-numeric:tabular-nums;font-size:.9rem}
.cal button.out{opacity:.35}
.cal button.today{border-color:var(--accent);font-weight:700}
.cal button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.steps{display:flex;flex-direction:column;gap:10px}
.step{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.step.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.crit{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line)}
.crit input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:0 0 auto}
.crit label{flex:1;font-size:.93rem}
.crit .meta{display:block;font-size:.76rem;color:var(--muted)}

table.explain{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
table.explain th,table.explain td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.explain td.r,table.explain th.r{text-align:right;white-space:nowrap}

details summary{cursor:pointer;font-weight:700;color:var(--link);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
.scroll-x{overflow-x:auto}

.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

.list-plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list-plain li{font-size:.92rem;display:flex;gap:8px;align-items:flex-start}
.list-plain li .pill{margin-top:1px}
.log{font-size:.84rem;color:var(--muted)}
.log li{border-bottom:1px solid var(--line);padding:5px 0}

/* Nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
#nav button{background:none;border:0;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:700;color:var(--muted)}
#nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

#sheet{position:fixed;inset:0;z-index:40}

#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;padding-inline:16px;padding-block:0 calc(24px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;overscroll-behavior:contain}

.field{display:flex;flex-direction:column;gap:5px}
.field>span,.lbl{font-size:.8rem;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,input.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 11px;min-height:44px;font-size:16px}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}

.scale-ends{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks input{position:absolute;opacity:0;pointer-events:none}
.checks label{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;font-weight:700;min-height:38px;display:inline-flex;align-items:center}

.checkline{display:flex;gap:10px;align-items:flex-start;padding:6px 0}

.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.inline-row{display:flex;gap:6px;align-items:center}
.inline-row .inp{flex:1;min-width:0}
.hint{border-radius:10px;padding:10px 12px;background:var(--warn-soft);font-size:.9rem}

.trend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

.trend>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.trend strong{font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums}

.meter{display:inline-flex;gap:3px}
.meter i{width:12px;height:12px;border-radius:3px;background:var(--surface-2);display:block;box-shadow:inset 0 0 0 1px var(--line)}

.spark{width:56px;height:18px;display:block}
.seg.six{grid-template-columns:repeat(6,1fr)}
.sec-help{font-size:.8rem;color:var(--muted)}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fhead>span{font-size:.8rem;font-weight:700;color:var(--muted)}
.hypt{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;color:var(--muted);white-space:nowrap}
.hypt input{width:16px;height:16px;accent-color:var(--warn);margin:0}

@media (prefers-reduced-motion:no-preference){.bar>span{transition:width .35s ease}}

const wq={};
function put(coll,obj){
  const data=clone(obj);delete data.virtual;
  S[coll]=Object.assign({},S[coll],{[data.id]:data});schedule();
  if(S.mode==='cloud'){const k=coll+'/'+data.id;wq[k]=(wq[k]||Promise.resolve()).then(()=>db.collection(coll).doc(data.id).set(data)).catch(e=>toast('Enregistrement impossible : '+((e&&(e.message||e.code))||'erreur')));return wq[k];}
  if(S.mode==='supabase'){const k=coll+'/'+data.id;const uidv=S.user&&S.user.id;wq[k]=(wq[k]||Promise.resolve()).then(()=>sb.from('carnet_docs').upsert({user_id:uidv,collection:coll,id:data.id,data,updated_at:new Date().toISOString()},{onConflict:'user_id,collection,id'})).then(r=>{if(r&&r.error)throw r.error;}).catch(e=>toast('Enregistrement impossible : '+((e&&e.message)||e)));return wq[k];}
  if(S.mode==='sheet'){const k=coll+'/'+data.id;const js=JSON.stringify(data);wq[k]=(wq[k]||Promise.resolve()).then(()=>gs('saveDoc',coll,js)).catch(e=>toast('Enregistrement impossible : '+((e&&e.message)||e)));return wq[k];}
  saveLocal();return Promise.resolve();
}
function del(coll,id){

  if(S.mode==='cloud'){const k=coll+'/'+id;wq[k]=(wq[k]||Promise.resolve()).then(()=>db.collection(coll).doc(id).delete()).catch(e=>toast('Suppression impossible : '+((e&&(e.message||e.code))||'erreur')));return wq[k];}
  if(S.mode==='supabase'){const k=coll+'/'+id;wq[k]=(wq[k]||Promise.resolve()).then(()=>sb.from('carnet_docs').delete().match({collection:coll,id})).then(r=>{if(r&&r.error)throw r.error;}).catch(e=>toast('Suppression impossible : '+((e&&e.message)||e)));return wq[k];}

}

async function sbLoad(user){
  const all=[];let from=0;
  for(;;){const r=await sb.from('carnet_docs').select('collection,id,data').range(from,from+999);if(r.error)throw r.error;all.push(...r.data);if(r.data.length<1000)break;from+=1000;}
  const m={profiles:{},plans:{},sessions:{}};all.forEach(x=>{if(m[x.collection])m[x.collection][x.id]=x.data;});
  S.profiles=m.profiles;S.plans=m.plans;S.sessions=m.sessions;S.user=user;S.ready=true;schedule();
  loadCalToken();
}
async function loadCalToken(){
  S.calToken=undefined;S.calErr='';
  try{const r=await sb.from('carnet_calendar_tokens').select('token').maybeSingle();if(r.error){S.calToken=null;S.calErr=r.error.message||'erreur';}else S.calToken=r.data?r.data.token:null;}
  catch(e){S.calToken=null;S.calErr=(e&&e.message)||'erreur';}
  schedule();
}
async function makeCalToken(){
  const a=new Uint8Array(24);crypto.getRandomValues(a);const t=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');
  const r=await sb.from('carnet_calendar_tokens').upsert({user_id:S.user.id,token:t},{onConflict:'user_id'});

}

        const m={};snap.docs.forEach(d=>{m[d.id]=d.data();});S[coll]=m;loaded.add(coll);

function stepFrac(st){const c=st.criteria||[];if(!c.length)return st.done?1:0;return c.filter(x=>x.done).length/c.length;}
function planProgress(p){const s=p.steps||[];if(!s.length)return 0;return s.reduce((a,st)=>a+stepFrac(st),0)/s.length;}
function currentStep(p){const s=p.steps||[];if(!s.length)return null;if(p.focusStepId){const f=s.find(x=>x.id===p.focusStepId);if(f)return f;}return s.find(x=>stepFrac(x)<1)||s[s.length-1];}
function activePause(p,d){return (p.pauses||[]).find(x=>d>=x.from&&(!x.to||d<=x.to));}
function occurs(p,d){return p.status==='active'&&p.startDate&&p.startDate<=d&&(!p.endDate||d<=p.endDate)&&(p.days||[]).includes(wd(d))&&!activePause(p,d);}
function rotationDog(p,d){const r=(p.rotation||[]).filter(id=>S.profiles[id]);if(!r.length)return null;if(r.length===1||!p.startDate||d<=p.startDate)return r[0];let n=0;for(let x=p.startDate;x<d;x=addDays(x,1)){if((p.days||[]).includes(wd(x)))n++;if(n>2000)break;}return r[n%r.length];}
function getItem(id,planId,date){const s=S.sessions[id];if(s)return s;return {id,planId,date,status:'planned',virtual:true};}
function itemsFor(d){
  const out={};
  for(const p of Object.values(S.plans)){if(occurs(p,d)){const id=p.id+'_'+d;out[id]=getItem(id,p.id,d);}}
  for(const s of Object.values(S.sessions)){if(s.date===d&&!out[s.id]&&S.plans[s.planId])out[s.id]=s;}
  const order=id=>{const pr=prof(id);return pr?(pr.order??99):99;};
  return Object.values(out).sort((a,b)=>order(primary(S.plans[a.planId]))-order(primary(S.plans[b.planId]))||String(S.plans[a.planId].title).localeCompare(S.plans[b.planId].title));
}

function doneSessions(planId){return Object.values(S.sessions).filter(s=>s.planId===planId&&s.status==='done').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:String(a.doneAt||'').localeCompare(String(b.doneAt||'')));}
function sessionsOfProfile(pid){return Object.values(S.sessions).filter(s=>s.status==='done'&&S.plans[s.planId]&&((S.plans[s.planId].subjects||[]).includes(pid)||s.dogId===pid)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}
const hasStress=s=>(s.emotions||[]).some(e=>STRESS.includes(e));
function nextDates(p,from,n){const out=[];for(let i=0;i<60&&out.length<n;i++){const d=addDays(from,i);itemsFor(d).forEach(it=>{if(it.planId===p.id&&it.status==='planned')out.push(it);});}return out.slice(0,n);}

function advice(p){
  if(p.status==='done')return{kind:'good',t:'Plan terminé',x:'Objectif atteint. Crée un plan d’entretien ou un nouveau défi.'};
  if(p.status==='archived')return{kind:'muted',t:'Archivé',x:'Ce plan n’est plus programmé.'};
  const t=today(),pause=activePause(p,t);
  if(pause)return{kind:'warn',t:'En pause',x:(pause.to?'Jusqu’au '+fmtDM(pause.to):'Sans date de fin')+(pause.reason?' · '+pause.reason:'')+'. Les acquis sont conservés.'};
  const st=currentStep(p);if(!st)return{kind:'muted',t:'À compléter',x:'Ajoute des étapes et des critères à ce plan.'};
  if(planProgress(p)>=1)return{kind:'good',t:'Objectif atteint',x:'Tous les critères sont validés. Passe le plan en « terminé » ou ajoute une étape.'};
  const ds=doneSessions(p.id),last=ds[ds.length-1];
  const nextCrit=(st.criteria||[]).find(c=>!c.done);
  if(last&&(num(last.fatigue)>=4||hasStress(last))){
    const why=[num(last.fatigue)>=4?'fatigue '+last.fatigue+'/5':null,hasStress(last)?(last.emotions||[]).filter(e=>STRESS.includes(e)).join(', ').toLowerCase():null].filter(Boolean).join(' et ');
    return{kind:'warn',t:'Alléger la prochaine séance',x:'Dernière séance ('+fmtDM(last.date)+') : '+why+'. Reste sur « '+st.title+' » en version plus facile ou prévois une récupération.'};
  }
  if(st.consolidate){const ok=ds.filter(s=>s.stepId===st.id&&s.date>=(st.consolidateSince||'')&&num(s.success)>=4).length;return{kind:'warn',t:'Consolider',x:'Répéter « '+st.title+' » : '+ok+'/2 séances réussies (réussite ≥ 4) depuis la décision.'+(ok>=2?' Tu peux marquer l’étape comme consolidée.':'')};}
  const onStep=ds.filter(s=>s.stepId===st.id).slice(-2);
  if(nextCrit&&onStep.length===2&&onStep.every(s=>num(s.success)>=4&&num(s.ease)>=4))return{kind:'good',t:'Prêt à valider',x:'2 dernières séances réussies et faciles : tente de valider « '+nextCrit.text+' ».'};
  if((st.level||0)<0)return{kind:'accent',t:'Variante allégée',x:'Continuer « '+st.title+' » au niveau '+st.level+'. Remonte d’un niveau après 2 séances réussies.'};
  return{kind:'accent',t:'Prochaine étape',x:'Travailler « '+st.title+' »'+(nextCrit?' · critère visé : '+nextCrit.text:'')+'.'};
}
function objCurrent(p,o){
  if(o.metricId){const vals=doneSessions(p.id).map(s=>num((s.measures||{})[o.metricId])).filter(v=>v!==null);if(vals.length)return o.direction==='down'?Math.min(...vals):Math.max(...vals);}
  const c=num(o.current);return c!==null?c:num(o.start);
}
function objPct(o,cur){const s=num(o.start)??0,t=num(o.target)??0;if(cur===null)return 0;if(t===s)return cur===t?1:0;return clamp((cur-s)/(t-s),0,1);}
function progressSeries(p){
  const steps=p.steps||[];if(!steps.length)return[];const ev=[];
  steps.forEach(st=>{const c=st.criteria||[];if(c.length)c.forEach(x=>{if(x.done)ev.push({d:x.doneAt||today(),w:1/c.length/steps.length});});else if(st.done)ev.push({d:st.doneAt||today(),w:1/steps.length});});
  ev.sort((a,b)=>a.d<b.d?-1:1);
  const start=[p.startDate||today(),...ev.map(e=>e.d)].sort()[0];
  const pts=[[start,0]];let acc=0;
  ev.forEach(e=>{pts.push([e.d,acc]);acc+=e.w;pts.push([e.d,acc]);});
  const end=today()>start?today():start;pts.push([end,acc]);return pts;
}

function spark(vals,lo,hi){if(vals.length<2)return '';const W=56,H=18;const X=i=>2+i*(W-4)/(vals.length-1),Y=v=>H-2-(clamp(v,lo,hi)-lo)/((hi-lo)||1)*(H-4);

function itemSummary(it,ev){
  const last=ev[ev.length-1];const v=valOf(last,it);if(v===null)return '';
  const hist=ev.map(e=>valOf(e,it)).filter(x=>x!==null);const prev=hist.length>1?hist[hist.length-2]:null;
  const isH=!!(last&&last.hyp&&last.hyp[it.id]);
  const lbl=`<span class="bh-l">${esc(it.label)}${isH?' <span class="pill warn">hypothèse</span>':''}${it.type==='scale'&&(it.lo||it.hi)?`<small>1 ${esc(it.lo||'')} · 5 ${esc(it.hi||'')}</small>`:''}</span>`;
  if(it.type==='scale'){const n=Number(v),d=prev!==null?n-Number(prev):0;
    return `<div class="bh-row">${lbl}<span class="meter" aria-label="${n} sur 5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span><span class="bh-v num">${n}/5${d?`<span class="d">${d>0?'↑':'↓'}${Math.abs(d)}</span>`:''}</span>${spark(hist.map(Number),1,5)||'<span></span>'}</div>`;}
  if(it.type==='number'){const n=Number(v),d=prev!==null?n-Number(prev):0;const nums=hist.map(Number);
    return `<div class="bh-row" style="grid-template-columns:auto 56px">${lbl}<span class="bh-v num">${fmtNum(n)} ${esc(it.unit||'')}${d?`<span class="d">${d>0?'↑':'↓'}${fmtNum(Math.abs(d))}</span>`:''}</span>${spark(nums,Math.min(...nums),Math.max(...nums))||'<span></span>'}</div>`;}
  if(it.type==='check')return `<div class="bh-block"><span class="bh-l">${esc(it.label)}</span><div class="row">${v.map(o=>`<span class="pill accent">${esc(o)}</span>`).join('')}</div></div>`;
  if(it.type==='choice')return `<div class="bh-block"><span class="bh-l">${esc(it.label)}</span><b>${esc(v)}</b></div>`;
  return `<div class="bh-block"><span class="bh-l">${esc(it.label)}</span><span class="small" style="white-space:pre-wrap">${esc(v)}</span></div>`;
}
function behaviorSection(pr){
  if(pr.kind!=='dog')return '';
  let h='<section class="block"><div class="row between"><h2>Profil comportemental</h2>';
  if(!pr.grid)return h+`</div><div class="card flat"><p class="small">Grille d’observation éthologique : environnements, relations sociales, motivateurs, émotions et seuils, signaux de communication, besoins, corps. Chaque observation est datée pour suivre l’évolution, et la grille est entièrement personnalisable.</p><div class="row"><button class="btn primary sm" data-act="gridInit" data-id="${pr.id}">Créer sa grille d’observation</button></div></div></section>`;
  const ev=evalsOf(pr),last=ev[ev.length-1];
  h+=`<span class="small muted">${last?'Observé le '+esc(fmtDM(last.date)):'Aucune observation'}</span></div>`;
  h+=`<div class="row"><button class="btn primary sm" data-act="evalNew" data-id="${pr.id}">+ Nouvelle observation</button><button class="btn sm" data-act="gridEdit" data-id="${pr.id}">Personnaliser la grille</button>${ev.length?`<button class="btn sm ghost" data-act="evalHist" data-id="${pr.id}">Historique (${ev.length})</button>`:''}</div>`;
  if(!last)return h+'<div class="empty">Fais une première observation pour établir son profil de départ.</div></section>';
  if(last.context)h+=`<p class="small muted">Contexte : ${esc(last.context)}</p>`;
  (pr.grid.sections||[]).forEach(sec=>{const rows=(sec.items||[]).map(it=>itemSummary(it,ev)).filter(Boolean);if(!rows.length)return;
    h+=`<div class="card flat"><div class="eyebrow">${esc(sec.title)}</div><div class="bh">${rows.join('')}</div></div>`;});
  const unk=[];(pr.grid.sections||[]).forEach(sec=>(sec.items||[]).forEach(it=>{if(!ev.some(e=>valOf(e,it)!==null))unk.push(it.label);}));
  if(unk.length)h+=`<details class="card flat"><summary>Encore inconnu (${unk.length} critères jamais observés)</summary><p class="small muted" style="margin-top:6px">${unk.map(esc).join(' · ')}</p></details>`;
  if(last.notes)h+=`<div class="card flat"><div class="eyebrow">Notes d’observation</div><p class="small" style="white-space:pre-wrap">${esc(last.notes)}</p></div>`;
  if(ev.length>1)h+=`<p class="small muted">↑ ↓ : écart avec l’observation précédente (${esc(fmtDM(ev[ev.length-2].date))}). La courbe montre toutes les observations.</p>`;
  return h+'</section>';
}
const hypT=(it,base)=>`<label class="hypt"><input type="checkbox" class="ev_hyp" data-item="${it.id}" ${base&&base.hyp&&base.hyp[it.id]?'checked':''}>hypothèse</label>`;
function evalSheet(pid,evId){
  const pr=prof(pid);const ev=evalsOf(pr);const cur=evId?(pr.evals||[]).find(e=>e.id===evId):null;
  const base=cur||ev[ev.length-1]||{values:{}};
  let b=`<input type="hidden" id="ev_pid" value="${esc(pid)}"><input type="hidden" id="ev_id" value="${esc(cur?cur.id:'')}">`;
  if(!cur&&ev.length)b+=`<p class="small muted">Pré-rempli avec l’observation du ${esc(fmtDM(base.date))} : modifie seulement ce qui a changé.</p>`;
  b+='<p class="small muted">Une valeur notée = <b>observée</b>. Coche « hypothèse » si c’est une supposition. « – » ou vide = <b>inconnu</b>.</p>';
  b+=`<div class="grid2"><label class="field"><span>Date</span><input class="inp" type="date" id="ev_date" value="${esc(cur?cur.date:today())}"></label><label class="field"><span>Durée d’observation</span><input class="inp" id="ev_dur" value="${esc(cur?cur.duration||'':'')}" placeholder="ex. 20 min"></label></div>
  <label class="field"><span>Contexte</span><input class="inp" id="ev_ctx" value="${esc(cur?cur.context||'':'')}" placeholder="Lieu, personnes et chiens présents, météo…"></label>`;
  (pr.grid.sections||[]).forEach(sec=>{
    b+=`<div class="edit-box"><h3>${esc(sec.title)}</h3>${sec.help?`<p class="sec-help">${esc(sec.help)}</p>`:''}`;
    (sec.items||[]).forEach(it=>{const v=valOf(base,it);const n='ev_'+it.id;
      if(it.type==='scale')b+=`<div class="field"><div class="fhead"><span>${esc(it.label)}</span>${hypT(it,base)}</div><div class="seg six">${['',1,2,3,4,5].map(k=>`<input type="radio" name="${n}" id="${n}_${k||0}" value="${k}" ${(v===null&&k==='')||(v!==null&&Number(v)===k)?'checked':''}><label for="${n}_${k||0}">${k||'–'}</label>`).join('')}</div>${it.lo||it.hi?`<div class="scale-ends"><span>1 · ${esc(it.lo||'')}</span><span>5 · ${esc(it.hi||'')}</span></div>`:''}</div>`;
      else if(it.type==='check'){const arr=Array.isArray(v)?v:[];const opts=it.options||[];const extra=arr.filter(x=>!opts.includes(x));
        b+=`<div class="field"><div class="fhead"><span>${esc(it.label)}</span>${hypT(it,base)}</div><div class="checks">${opts.map((o,i)=>`<input type="checkbox" class="ev_chk" data-item="${it.id}" id="${n}_${i}" value="${esc(o)}" ${arr.includes(o)?'checked':''}><label for="${n}_${i}">${esc(o)}</label>`).join('')}</div><input class="inp" data-other="${it.id}" value="${esc(extra.join(', '))}" placeholder="Autre (séparer par des virgules)"></div>`;}
      else if(it.type==='choice'){const opts=it.options||[];b+=`<div class="field"><div class="fhead"><span>${esc(it.label)}</span>${hypT(it,base)}</div><div class="checks"><input type="radio" name="${n}" id="${n}_x" value="" ${v===null?'checked':''}><label for="${n}_x">–</label>${opts.map((o,i)=>`<input type="radio" name="${n}" id="${n}_${i}" value="${esc(o)}" ${v===o?'checked':''}><label for="${n}_${i}">${esc(o)}</label>`).join('')}</div></div>`;}
      else if(it.type==='number')b+=`<div class="field"><div class="fhead"><span>${esc(it.label)}${it.unit?' ('+esc(it.unit)+')':''}</span>${hypT(it,base)}</div><input class="inp" type="number" step="any" inputmode="decimal" data-num-item="${it.id}" value="${v===null?'':esc(v)}"></div>`;
      else b+=`<div class="field"><div class="fhead"><span>${esc(it.label)}</span>${hypT(it,base)}</div><textarea class="inp" rows="2" data-text-item="${it.id}">${v===null?'':esc(v)}</textarea></div>`;
    });
    b+='</div>';
  });
  b+=`<label class="field"><span>Notes d’observation (séquences, comportements précis, hypothèses)</span><textarea class="inp" id="ev_notes" rows="3">${esc(cur?cur.notes||'':'')}</textarea></label>`;
  openSheet((cur?'Modifier l’observation · ':'Observation · ')+pr.name,b,'<button class="btn primary" data-act="evalSave">Enregistrer l’observation</button><button class="btn ghost" data-act="closeSheet">Annuler</button>');
}
function saveEval(){
  const pid=$('#ev_pid').value,eid=$('#ev_id').value;const pr=clone(prof(pid));const values={};
  (pr.grid.sections||[]).forEach(sec=>(sec.items||[]).forEach(it=>{
    if(it.type==='scale'||it.type==='choice'){const r=document.querySelector(`input[name="ev_${it.id}"]:checked`);if(r&&r.value!=='')values[it.id]=it.type==='scale'?Number(r.value):r.value;}
    else if(it.type==='check'){const a=[...document.querySelectorAll(`.ev_chk[data-item="${it.id}"]:checked`)].map(x=>x.value);const o=document.querySelector(`[data-other="${it.id}"]`);if(o&&o.value.trim())o.value.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!a.includes(x))a.push(x);});if(a.length)values[it.id]=a;}
    else if(it.type==='number'){const x=document.querySelector(`[data-num-item="${it.id}"]`);if(x&&x.value!=='')values[it.id]=Number(x.value);}
    else{const x=document.querySelector(`[data-text-item="${it.id}"]`);if(x&&x.value.trim())values[it.id]=x.value.trim();}
  }));
  const hyp={};document.querySelectorAll('.ev_hyp:checked').forEach(x=>{if(values[x.dataset.item]!==undefined)hyp[x.dataset.item]=true;});
  const e={id:eid||uid('ev'),hyp,date:$('#ev_date').value||today(),duration:$('#ev_dur').value.trim(),context:$('#ev_ctx').value.trim(),notes:$('#ev_notes').value.trim(),values};
  pr.evals=pr.evals||[];const i=pr.evals.findIndex(x=>x.id===e.id);
  if(i>=0)pr.evals[i]=Object.assign({},pr.evals[i],e,{updatedAt:new Date().toISOString()});else{e.createdAt=new Date().toISOString();pr.evals.push(e);}
  put('profiles',pr);closeSheet();toast('Observation enregistrée ('+Object.keys(values).length+' critères notés)');
}
function evalHistSheet(pid){
  const pr=prof(pid);const ev=evalsOf(pr).reverse();
  const b=ev.length?ev.map(e=>`<div class="card flat"><div class="row between"><b style="text-transform:capitalize">${esc(fmtLong(e.date))}</b><span class="small muted">${Object.keys(e.values||{}).length} critères notés</span></div>${e.context||e.duration?`<p class="small muted">${esc([e.context,e.duration].filter(Boolean).join(' · '))}</p>`:''}<div class="row"><button class="btn sm" data-act="evalEdit" data-id="${pid}" data-ev="${e.id}">Modifier</button><button class="btn sm danger" data-act="evalDel" data-id="${pid}" data-ev="${e.id}">${UI.confirm==='ev_'+e.id?'Confirmer la suppression':'Supprimer'}</button></div></div>`).join(''):'<div class="empty">Aucune observation.</div>';
  openSheet('Historique · '+pr.name,b);
}

      if(it.type==='scale')b+=`<div class="grid2"><label class="field"><span>Repère du 1</span>${inp(P+'.lo',it.lo,'ex. très inconfortable')}</label><label class="field"><span>Repère du 5</span>${inp(P+'.hi',it.hi,'ex. totalement à l’aise')}</label></div>`;
      if(it.type==='check'||it.type==='choice')b+=`<label class="field"><span>Options (séparées par des virgules)</span><input class="inp" data-bindlist="${P}.options" value="${esc((it.options||[]).join(', '))}" placeholder="Voix, Caresses, Nourriture, Jeu"></label>`;
      if(it.type==='number')b+=`<label class="field"><span>Unité</span>${inp(P+'.unit',it.unit,'m, s, min, rép.…')}</label>`;
      b+='</div>';});
    b+=`<button class="btn sm ghost" data-act="listAdd" data-path="sections.${i}.items" data-kind="gitem">+ Critère</button></div>`;
  });
  b+='<div class="row"><button class="btn" data-act="listAdd" data-path="sections" data-kind="gsection">+ Rubrique</button><button class="btn ghost" data-act="gridReset">Recharger la grille type</button></div>';
  const sc=$('#sheet .panel');const top=sc?sc.scrollTop:0;
  openSheet('Grille d’observation · '+pname(d.pid),b,'<button class="btn primary" data-act="gridSave">Enregistrer la grille</button><button class="btn ghost" data-act="closeSheet">Annuler</button>');
  const sc2=$('#sheet .panel');if(sc2)sc2.scrollTop=top;
}
function saveGrid(){

/* ---------- rendu ---------- */
function render(){
  renderNav();
  const app=$('#app');
  if(!S.ready){app.innerHTML='<p class="muted" style="padding:40px 0;text-align:center">Chargement du carnet…</p>';return;}
  if(S.mode==='supabase'&&(S.cfgError||!S.user||UI.recovery)){$('#nav').innerHTML='';app.innerHTML=authView();return;}
  let h=topbar();
  if(!profilesList().length&&UI.tab!=='profiles')h+=onboarding();
  else if(UI.tab==='today')h+=viewToday();
  else if(UI.tab==='cal')h+=viewCal();
  else if(UI.tab==='dash')h+=viewDash();
  else if(UI.tab==='plans')h+=UI.planId&&S.plans[UI.planId]?viewPlan(S.plans[UI.planId]):viewPlans();
  else h+=viewProfiles();
  app.innerHTML=h;
}
function renderNav(){
  if(S.mode==='supabase'&&(!S.user||UI.recovery)){$('#nav').innerHTML='';return;}
  const tabs=[['today','Aujourd’hui',IC.today],['cal','Calendrier',IC.cal],['dash','Suivi',IC.dash],['plans','Plans',IC.plans],['profiles','Profils',IC.prof]];
  $('#nav').innerHTML='<div class="in">'+tabs.map(t=>`<button data-act="tab" data-tab="${t[0]}" ${UI.tab===t[0]?'aria-current="page"':''}>${t[2]}<span>${t[1]}</span></button>`).join('')+'</div>';
}
function topbar(){
  const m=S.mode==='supabase'?'<span class="sync"><i></i>Enregistré en ligne</span>':S.mode==='sheet'?'<span class="sync"><i></i>Enregistré dans Google Sheets</span>':S.mode==='cloud'?'<span class="sync"><i></i>Sauvegardé en ligne</span>':'<span class="sync local"><i></i>Stockage local (ce navigateur)</span>';
  return `<div class="topbar"><span class="brand">Carnet de Meute</span>${m}</div>`;
}
function onboarding(){
  return `<div class="stack" style="margin-top:20px"><h1>Bienvenue</h1><p class="muted">Commence par créer ton profil puis celui de chacun de tes chiens. Tu pourras ensuite créer autant de plans que tu veux.</p>
  <div class="row"><button class="btn primary" data-act="newProfile" data-kind="human">Créer mon profil</button><button class="btn" data-act="newProfile" data-kind="dog">Ajouter un chien</button></div></div>`;
}
const who=id=>`<span class="who"><i class="dot" style="background:${pcolor(id)}"></i>${esc(pname(id))}</span>`;
function statusPill(it){
  if(it.status==='done')return '<span class="pill good">Fait</span>';
  if(it.status==='moved')return `<span class="pill">Reportée · ${esc(fmtDM(it.movedTo))}</span>`;
  if(it.status==='skipped')return '<span class="pill">Passée</span>';
  if(it.date<today())return '<span class="pill warn">Non renseignée</span>';
  if(it.movedFrom)return `<span class="pill accent">Reportée du ${esc(fmtDM(it.movedFrom))}</span>`;
  return '<span class="pill accent">Prévue</span>';
}
function ratingsHTML(s){
  const r=SCALES.filter(x=>num(s[x[0]])!==null).map(x=>`<span class="rating">${x[1]} <b>${s[x[0]]}/5</b></span>`).join('');
  return r?`<div class="ratings">${r}</div>`:'';
}
function sessionCard(it,opt){
  opt=opt||{};const p=S.plans[it.planId];if(!p)return'';
  const st=(p.steps||[]).find(s=>s.id===it.stepId)||currentStep(p);
  const dog=sessionDog(it);
  const data=`data-id="${esc(it.id)}" data-plan="${esc(it.planId)}" data-date="${esc(it.date)}"`;
  let h=`<div class="card"><div class="row between"><div class="row">${(p.subjects||[]).map(who).join('')}${dog&&!(p.subjects||[]).includes(dog)?'<span class="small muted">avec</span>'+who(dog):''}</div>${statusPill(it)}</div>`;
  h+=`<div><button class="linkbtn" data-act="openPlan" data-id="${esc(p.id)}" style="text-decoration:none;color:var(--ink)"><h3>${esc(p.title)}</h3></button>`+(opt.showDate?`<div class="small muted">${esc(fmtLong(it.date))}</div>`:'')+`</div>`;
  if(it.example)h+='<span class="pill ex" style="align-self:flex-start">Exemple</span>';
  if(it.status==='done'){
    if(st)h+=`<div class="small"><span class="muted">Étape :</span> ${esc(st.title)}</div>`;
    h+=ratingsHTML(it);
    if((it.emotions||[]).length)h+=`<div class="small"><span class="muted">État :</span> ${esc(it.emotions.join(', '))}</div>`;
    const ms=(p.metrics||[]).filter(m=>num((it.measures||{})[m.id])!==null).map(m=>`${esc(m.label)} <b class="num">${fmtNum(it.measures[m.id])}</b> ${esc(m.unit||'')}`);
    if(ms.length)h+=`<div class="small">${ms.join(' · ')}</div>`;
    if(it.comment)h+=`<div class="small muted">« ${esc(it.comment)} »</div>`;
    h+=`<div class="row"><button class="btn sm" data-act="bilan" ${data}>Modifier le bilan</button></div>`;
  }else if(it.status==='planned'){
    if(st){h+=`<div class="small"><span class="muted">Étape :</span> <b>${esc(st.title)}</b>${(st.level||0)<0?` <span class="pill warn">Allégée ${st.level}</span>`:''}${st.consolidate?' <span class="pill warn">À consolider</span>':''}</div>`;
      if((st.exercises||[]).length)h+=`<ul class="ex-list">${st.exercises.slice(0,5).map(e=>`<li>${esc(e.name)}${e.dose?` <span class="muted">· ${esc(e.dose)}</span>`:''}</li>`).join('')}</ul>`;}
    h+=`<div class="row"><button class="btn primary sm" data-act="bilan" ${data}>Faire le bilan</button><button class="btn sm" data-act="report" ${data}>Reporter</button><button class="btn ghost sm" data-act="skip" ${data}>Passer</button></div>`;
  }else{
    h+=`<div class="row"><button class="btn ghost sm" data-act="undoMove" ${data}>Annuler ${it.status==='moved'?'le report':''}</button></div>`;
  }
  return h+'</div>';
}

function viewToday(){
  const t=today();const items=itemsFor(t);
  let h=`<h1 style="text-transform:capitalize">${esc(fmtLong(t))}</h1>`;
  // semaine
  const mon=addDays(t,-wd(t));

function viewCal(){

  h+='<div class="cal" style="margin-top:12px">'+DAYS.map(d=>`<div class="h">${d}</div>`).join('');
  for(let i=0;i<42;i++){const d=addDays(start,i);const its=itemsFor(d);const out=parse(d).getMonth()!==m-1;

/* --- Suivi (tableau de bord) --- */
function lineChart(series,o){
  o=o||{};const W=340,H=o.h||150,L=42,R=10,T=10,B=24;
  const all=series.flatMap(s=>s.points);if(!all.length)return '';
  const xs=all.map(p=>parse(p[0]).getTime());let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0)x1=x0+864e5;
  let y0=o.yMin!==undefined?o.yMin:Math.min(...all.map(p=>p[1])),y1=o.yMax!==undefined?o.yMax:Math.max(...all.map(p=>p[1]));
  if(y1===y0){y1=y0+1;}
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const ticks=o.ticks||[y0,(y0+y1)/2,y1];
  let g=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" style="stroke:var(--line);stroke-width:1"/><text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" style="fill:var(--muted);font-size:10px">${o.fmt?o.fmt(v):fmtNum(Math.round(v*10)/10)}</text>`).join('');
  const d0=iso(new Date(x0)),d1=iso(new Date(x1));
  g+=`<text x="${L}" y="${H-6}" style="fill:var(--muted);font-size:10px">${esc(fmtDM(d0))}</text><text x="${W-R}" y="${H-6}" text-anchor="end" style="fill:var(--muted);font-size:10px">${esc(fmtDM(d1))}</text>`;
  series.forEach(s=>{
    const pts=s.points.map(p=>[X(parse(p[0]).getTime()),Y(p[1])]);
    g+=`<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" style="fill:none;stroke:${s.color};stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round"/>`;
    if(s.dots)pts.forEach(p=>{g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" style="fill:${s.color}"/>`;});
    const e=pts[pts.length-1];g+=`<circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="4" style="fill:${s.color};stroke:var(--surface);stroke-width:1.5"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Graphique')}">${g}</svg>`+(series.length>1||o.legend?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'');
}
const PLAN_COLORS=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
function strengths(pid){
  const solid=[],fragile=[];
  plansOf(pid).filter(p=>p.status!=='archived').forEach(p=>{
    const ds=doneSessions(p.id);
    (p.steps||[]).forEach(st=>{
      const f=stepFrac(st);const recent=ds.filter(s=>s.stepId===st.id).slice(-3);
      const avg=recent.length?recent.reduce((a,s)=>a+(num(s.success)||0),0)/recent.length:null;
      const tag=esc(p.title);
      if(st.consolidate)fragile.push({t:st.title,p:tag,why:'étape à répéter / consolider'});
      else if((st.level||0)<0)fragile.push({t:st.title,p:tag,why:'difficulté diminuée ('+st.level+')'});
      else if(f>0&&avg!==null&&avg<3)fragile.push({t:st.title,p:tag,why:'réussite moyenne '+fmtNum(Math.round(avg*10)/10)+'/5 sur les dernières séances'});
      else if(f===1)solid.push({t:st.title,p:tag,why:(st.criteria||[]).length?(st.criteria.length+' critère'+(st.criteria.length>1?'s':'')+' validé'+(st.criteria.length>1?'s':'')):'étape validée'});
      else if(f>0){(st.criteria||[]).filter(c=>c.done).forEach(c=>solid.push({t:c.text,p:tag,why:'critère validé'+(c.doneAt?' le '+fmtDM(c.doneAt):'')}));}
    });
  });
  return{solid,fragile};
}
function trendsHTML(pid){
  const ss=sessionsOfProfile(pid);if(!ss.length)return '<div class="empty">Pas encore de bilan de séance.</div>';
  const last=ss.slice(-5),prev=ss.slice(-10,-5);
  const avg=(arr,k)=>{const v=arr.map(s=>num(s[k])).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  return '<div class="trend">'+SCALES.map(([k,l])=>{const a=avg(last,k),b=avg(prev,k);let arr='';if(a!==null&&b!==null){const d=a-b;const good=k==='fatigue'?d<0:d>0;arr=Math.abs(d)<.2?'<span class="small muted">stable</span>':`<span class="small" style="color:${good?'var(--good)':'var(--bad)'}">${d>0?'↑':'↓'} ${fmtNum(Math.abs(Math.round(d*10)/10))}</span>`;}
    return `<div><div class="small muted">${l}</div><strong>${a===null?'–':fmtNum(Math.round(a*10)/10)}</strong><span class="small muted">/5</span> ${arr}</div>`;}).join('')+'</div><p class="small muted">Moyenne des 5 dernières séances'+(prev.length?', comparée aux 5 précédentes':'')+'.</p>';
}

function stepStatus(p,st){

  if(f>0)return '<span class="pill">Commencée</span>';
  return '<span class="pill">À venir</span>';
}

    if(cr.length)h+='<div>'+cr.map(c=>`<div class="crit"><input type="checkbox" id="c_${c.id}" data-act="toggleCrit" data-plan="${p.id}" data-step="${st.id}" data-crit="${c.id}" ${c.done?'checked':''}><label for="c_${c.id}">${esc(c.text)}<span class="meta">${c.done?'Validé le '+esc(fmtDM(c.doneAt||today()))+(c.bySession?' (bilan de séance)':' (manuellement)'):'Non validé'}</span></label></div>`).join('')+'</div>';
    else h+=`<div class="crit"><input type="checkbox" id="sd_${st.id}" data-act="toggleStepDone" data-plan="${p.id}" data-step="${st.id}" ${st.done?'checked':''}><label for="sd_${st.id}">Étape validée<span class="meta">Aucun critère défini : ajoute-en dans « Modifier » pour une progression plus fine.</span></label></div>`;
    h+=`<div class="row"><button class="btn sm" data-act="adjust" data-kind="repeat" data-plan="${p.id}" data-step="${st.id}">Répéter l’étape</button>${(st.level||0)<0?`<button class="btn sm" data-act="adjust" data-kind="harder" data-plan="${p.id}" data-step="${st.id}">Remonter d’un niveau</button>`:''}<button class="btn sm" data-act="adjust" data-kind="lighten" data-plan="${p.id}" data-step="${st.id}">Diminuer la difficulté</button>${st.consolidate?`<button class="btn sm primary" data-act="adjust" data-kind="consolidated" data-plan="${p.id}" data-step="${st.id}">Marquer consolidée</button>`:''}</div></div>`;});
  if(!N)h+='<div class="empty">Aucune étape. Ajoute-les avec « Modifier le plan ».</div>';
  h+='</div></section>';
  // actions
  const cf=UI.confirm===p.id;
  h+=`<section class="block"><h2>Actions</h2><div class="row"><button class="btn primary" data-act="editPlan" data-id="${p.id}">Modifier le plan</button>${p.status==='active'?(pause?`<button class="btn" data-act="resume" data-id="${p.id}">Reprendre</button>`:`<button class="btn" data-act="pause" data-id="${p.id}">Faire une pause</button>`):''}<button class="btn" data-act="addSession" data-plan="${p.id}" data-date="${today()}">+ Séance</button><button class="btn" data-act="dupPlan" data-id="${p.id}">Dupliquer</button>${p.status==='active'?`<button class="btn" data-act="planStatus" data-id="${p.id}" data-s="done">Marquer terminé</button><button class="btn ghost" data-act="planStatus" data-id="${p.id}" data-s="archived">Archiver</button>`:`<button class="btn" data-act="planStatus" data-id="${p.id}" data-s="active">Réactiver</button>`}<button class="btn danger" data-act="delPlan" data-id="${p.id}">${cf?'Confirmer la suppression':'Supprimer'}</button></div>${cf?'<p class="small muted">Supprime le plan et ses bilans de séance. Touche à nouveau pour confirmer.</p>':''}</section>`;
  // mesures
  const ds=doneSessions(p.id);
  const mcharts=(p.metrics||[]).map((m,i)=>{const pts=ds.filter(s=>num((s.measures||{})[m.id])!==null).map(s=>[s.date,num(s.measures[m.id])]);if(!pts.length)return'';return `<div class="card flat"><div class="eyebrow">${esc(m.label)}${m.unit?' ('+esc(m.unit)+')':''}</div>${lineChart([{name:m.label,color:PLAN_COLORS[i%PLAN_COLORS.length],points:pts,dots:true}],{label:m.label,h:120})}</div>`;}).join('');
  if(mcharts)h+='<section class="block"><h2>Mesures</h2>'+mcharts+'</section>';
  const nx=nextDates(p,today(),4);
  if(nx.length)h+='<section class="block"><h2>Prochaines séances</h2>'+nx.map(it=>sessionCard(it,{showDate:true})).join('')+'</section>';
  h+='<section class="block"><h2>Historique des séances</h2>'+(ds.length?ds.slice().reverse().map(s=>sessionCard(s,{showDate:true})).join(''):'<div class="empty">Aucun bilan pour ce plan.</div>')+'</section>';
  if((p.log||[]).length)h+=`<section class="block"><details><summary>Journal des décisions (${p.log.length})</summary><ul class="list-plain log" style="margin-top:8px">${p.log.map(l=>`<li><span class="num">${esc(fmtDM(l.date||today()))}</span> · ${esc(l.text)}${l.example?' <span class="pill ex">Exemple</span>':''}</li>`).join('')}</ul></details></section>`;
  return h;
}

function authView(){
  const brand='<div class="topbar"><span class="brand">Carnet de Meute</span></div>';
  if(S.cfgError)return brand+'<div class="card"><h2>Configuration incomplète</h2><p class="small">La bibliothèque Supabase ne s’est pas chargée ou l’adresse / la clé du projet manquent dans index.html. Vérifie ta connexion puis recharge la page.</p></div>';
  if(UI.recovery)return brand+`<div class="stack" style="margin-top:12px"><h1>Nouveau mot de passe</h1><label class="field"><span>Nouveau mot de passe (6 caractères min.)</span><input class="inp" type="password" id="au_new" autocomplete="new-password"></label><button class="btn primary" data-act="setNewPw">Enregistrer</button><p id="authMsg" class="small" role="status"></p></div>`;
  return brand+`<div class="stack" style="margin-top:12px"><h1>Suivre la progression de tes chiens</h1><p class="muted">Profils, plans, séances et bilans. Tes données sont privées et liées à ton compte.</p>
  <label class="field"><span>Email</span><input class="inp" type="email" id="au_email" autocomplete="email" inputmode="email"></label>
  <label class="field"><span>Mot de passe (6 caractères min.)</span><input class="inp" type="password" id="au_pw" autocomplete="current-password"></label>
  <div class="row"><button class="btn primary" data-act="signIn">Se connecter</button><button class="btn" data-act="signUp">Créer un compte</button></div>
  <button class="linkbtn" data-act="resetPw" style="align-self:flex-start">Mot de passe oublié ?</button>
  <p id="authMsg" class="small" role="status"></p></div>`;
}
function authMsg(t,bad){const m=$('#authMsg');if(m){m.textContent=t;m.style.color=bad?'var(--bad)':'var(--ink)';}}
function authErr(e){const m=(e&&e.message)||String(e);
  if(/Invalid login credentials/i.test(m))return 'Email ou mot de passe incorrect.';
  if(/Email not confirmed/i.test(m))return 'Confirme d’abord ton adresse email (lien reçu par mail), puis reconnecte-toi.';
  if(/already registered|already been registered/i.test(m))return 'Un compte existe déjà avec cet email : connecte-toi.';
  if(/at least 6|Password should be/i.test(m))return 'Le mot de passe doit contenir au moins 6 caractères.';
  if(/rate limit/i.test(m))return 'Trop de tentatives. Réessaie dans quelques minutes.';
  return m;}
async function authAct(a){
  const redirect=location.origin+location.pathname;
  const email=($('#au_email')||{}).value?.trim(),pw=($('#au_pw')||{}).value;
  try{
    if(a==='signIn'){if(!email||!pw)return authMsg('Indique ton email et ton mot de passe.',1);authMsg('Connexion…');const r=await sb.auth.signInWithPassword({email,password:pw});if(r.error)throw r.error;}
    if(a==='signUp'){if(!email||!pw)return authMsg('Indique un email et un mot de passe.',1);authMsg('Création du compte…');const r=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:redirect}});if(r.error)throw r.error;if(!r.data.session)authMsg('Compte créé. Ouvre le lien reçu par email pour le confirmer, puis connecte-toi.');}
    if(a==='resetPw'){if(!email)return authMsg('Indique d’abord ton email.',1);const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirect});if(r.error)throw r.error;authMsg('Si un compte existe, un email de réinitialisation vient d’être envoyé.');}
    if(a==='setNewPw'){const np=$('#au_new').value;const r=await sb.auth.updateUser({password:np});if(r.error)throw r.error;UI.recovery=false;toast('Mot de passe modifié');render();}
    if(a==='signOut'){await sb.auth.signOut();UI.tab='today';}
  }catch(e){authMsg(authErr(e),1);if(a==='signOut')toast(authErr(e));}
}

function renderEditor(){

function applyAdjust(p,st,kind,extra){
  extra=extra||{};const ex=extra.example?{example:true}:{};
  if(kind==='repeat'){st.repeats=(st.repeats||0)+1;st.consolidate=true;st.consolidateSince=extra.date||today();p.focusStepId=st.id;logEntry(p,'Répéter l’étape « '+st.title+' » (acquis conservés)',Object.assign({kind,stepId:st.id},ex));}
  else if(kind==='lighten'){st.level=(st.level||0)-1;logEntry(p,'Difficulté diminuée pour « '+st.title+' » (niveau '+st.level+')',Object.assign({kind,stepId:st.id},ex));}
  else if(kind==='harder'){st.level=Math.min(0,(st.level||0)+1);logEntry(p,'Difficulté remontée pour « '+st.title+' » (niveau '+st.level+')',{kind,stepId:st.id});}

  else if(kind==='pause'){const from=extra.from||today();const n=Math.max(1,Number(extra.days)||3);p.pauses=p.pauses||[];p.pauses.push(Object.assign({id:uid('pz'),from,to:addDays(from,n-1),reason:extra.reason||''},ex));logEntry(p,'Pause de '+n+' jour(s) à partir du '+fmtDM(from)+(extra.reason?' : '+extra.reason:''),Object.assign({kind},ex));}
}
function saveBilan(){

  });
  Object.values(d.plans||{}).forEach(pl=>{if(!pl||!pl.id)return;const x=clone(pl);x.subjects=(x.subjects||[]).map(mid);x.rotation=(x.rotation||[]).map(mid);put('plans',x);});
  Object.values(d.sessions||{}).forEach(se=>{if(!se||!se.id)return;const x=clone(se);if(x.dogId)x.dogId=mid(x.dogId);put('sessions',x);});
}
function removeExamples(){
  const ex=Object.values(S.sessions).filter(s=>s.example);const ids=new Set(ex.map(s=>s.id));
  Object.values(S.plans).forEach(p0=>{
    const p=clone(p0);let ch=false;
    (p.steps||[]).forEach(st=>{(st.criteria||[]).forEach(c=>{if(c.done&&ids.has(c.bySession)){c.done=false;delete c.doneAt;delete c.bySession;ch=true;}});});
    (p.log||[]).filter(l=>l.example).forEach(l=>{const st=(p.steps||[]).find(s=>s.id===l.stepId);
      if(l.kind==='repeat'&&st){st.repeats=Math.max(0,(st.repeats||1)-1);st.consolidate=false;delete st.consolidateSince;if(p.focusStepId===st.id)delete p.focusStepId;}
      if(l.kind==='lighten'&&st)st.level=Math.min(0,(st.level||0)+1);ch=true;});
    if((p.pauses||[]).some(z=>z.example)){p.pauses=p.pauses.filter(z=>!z.example);ch=true;}
    if(ch){p.log=(p.log||[]).filter(l=>!l.example);put('plans',p);}
  });
  ex.forEach(s=>del('sessions',s.id));toast(ex.length+' séances d’exemple supprimées');
}

/* ---------- événements ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,ds=el.dataset;
  if(el.type==='checkbox'&&(a==='toggleCrit'||a==='toggleStepDone')){/* handled on change */return;}
  if(a!=='delPlan'&&a!=='removeExamples'&&a!=='delProfile'&&a!=='evalDel'&&a!=='calReset')UI.confirm=null;
  switch(a){
    case 'tab':UI.tab=ds.tab;if(ds.tab==='plans')UI.planId=null;render();window.scrollTo(0,0);break;
    case 'openPlan':UI.tab='plans';UI.planId=ds.id;closeSheet();render();window.scrollTo(0,0);break;
    case 'backPlans':UI.planId=null;render();window.scrollTo(0,0);break;
    case 'planFilter':UI.planFilter=ds.id;render();break;
    case 'dash':UI.dash=ds.id;render();break;
    case 'calPrev':case 'calNext':{const [y,m]=UI.calMonth.split('-').map(Number);const d=new Date(y,m-1+(a==='calNext'?1:-1),1);UI.calMonth=iso(d).slice(0,7);render();break;}
    case 'calDay':UI.calSel=ds.date;UI.calMonth=ds.date.slice(0,7);UI.tab='cal';render();break;
    case 'newProfile':profileSheet(null,ds.kind);break;
    case 'editProfile':profileSheet(ds.id);break;
    case 'saveProfile':saveProfile();break;
    case 'delProfile':if(UI.confirm==='prof_'+ds.id){UI.confirm=null;del('profiles',ds.id);closeSheet();toast('Profil supprimé');}else{UI.confirm='prof_'+ds.id;profileSheet(ds.id);}break;
    case 'newPlan':planSheet(null,ds.subject||(UI.planFilter!=='all'?UI.planFilter:null));break;
    case 'editPlan':planSheet(ds.id);break;
    case 'savePlan':savePlan();break;
    case 'listAdd':{const arr=getPath(draft,ds.path);arr.push(FACT[ds.kind]());rerenderDraft();break;}
    case 'listDel':{const arr=getPath(draft,ds.path);arr.splice(Number(ds.i),1);rerenderDraft();break;}
    case 'listMove':{const arr=getPath(draft,ds.path);const i=Number(ds.i),j=i+Number(ds.dir);if(j<0||j>=arr.length)break;[arr[i],arr[j]]=[arr[j],arr[i]];rerenderDraft();break;}
    case 'adjust':{const p=clone(S.plans[ds.plan]);const st=p.steps.find(s=>s.id===ds.step);applyAdjust(p,st,ds.kind);put('plans',p);toast({repeat:'Étape à répéter : acquis conservés',lighten:'Difficulté diminuée',harder:'Difficulté remontée',consolidated:'Étape consolidée'}[ds.kind]);break;}
    case 'pause':pauseSheet(ds.id);break;
    case 'savePause':{const p=clone(S.plans[$('#pz_id').value]);applyAdjust(p,null,'pause',{from:$('#pz_from').value,days:$('#pz_days').value,reason:$('#pz_reason').value.trim()});put('plans',p);closeSheet();toast('Plan en pause');break;}
    case 'resume':{const p=clone(S.plans[ds.id]);const t=today();(p.pauses||[]).forEach(z=>{if(t>=z.from&&(!z.to||t<=z.to))z.to=addDays(t,-1);});p.pauses=(p.pauses||[]).filter(z=>!z.to||z.to>=z.from);logEntry(p,'Reprise du plan');put('plans',p);toast('Plan repris');break;}
    case 'dupPlan':{const p=clone(S.plans[ds.id]);p.id=uid('pl_');p.title=p.title+' (copie)';p.startDate=today();p.pauses=[];p.log=[];delete p.focusStepId;(p.steps||[]).forEach(s=>{s.id=uid('st');s.level=0;s.repeats=0;s.consolidate=false;s.done=false;delete s.doneAt;(s.criteria||[]).forEach(c=>{c.id=uid('c');c.done=false;delete c.doneAt;delete c.bySession;});(s.exercises||[]).forEach(x=>{x.id=uid('e');});});logEntry(p,'Plan dupliqué');put('plans',p);UI.planId=p.id;toast('Plan dupliqué');break;}
    case 'planStatus':{const p=clone(S.plans[ds.id]);p.status=ds.s;logEntry(p,{done:'Plan marqué terminé',archived:'Plan archivé',active:'Plan réactivé'}[ds.s]);put('plans',p);break;}
    case 'delPlan':if(UI.confirm===ds.id){UI.confirm=null;Object.values(S.sessions).filter(s=>s.planId===ds.id).forEach(s=>del('sessions',s.id));del('plans',ds.id);UI.planId=null;toast('Plan supprimé');}else{UI.confirm=ds.id;render();}break;
    case 'bilan':bilanSheet(getItem(ds.id,ds.plan,ds.date));break;
    case 'saveBilan':saveBilan();break;
    case 'report':reportSheet(getItem(ds.id,ds.plan,ds.date));break;
    case 'rpQuick':$('#rp_date').value=ds.v;break;
    case 'saveReport':saveReport();break;
    case 'skip':{const it=getItem(ds.id,ds.plan,ds.date);put('sessions',Object.assign({},it,{status:'skipped'}));toast('Séance passée');break;}
    case 'undoMove':undoMove(getItem(ds.id,ds.plan,ds.date));break;
    case 'addSession':addSessionSheet(ds.plan,ds.date);break;
    case 'saveAddSession':{const planId=$('#as_plan').value,date=$('#as_date').value||today();const s={id:uid('s_'),planId,date,status:'planned',createdAt:new Date().toISOString()};const dg=rotationDog(S.plans[planId],date);if(dg)s.dogId=dg;put('sessions',s);closeSheet();if(ds.now)bilanSheet(s);else toast('Séance programmée le '+fmtShort(date));break;}
    case 'ctxChip':{e.preventDefault();const i=$('#bl_ctx');i.value=(i.value?i.value.replace(/[,\s]+$/,'')+', ':'')+ds.v;break;}
    case 'export':doExport();break;
    case 'copyExport':{const t=$('#exp_txt');const v=t.value;(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copié')).catch(()=>{t.focus();t.select();toast('Texte sélectionné : copie-le');});break;}
    case 'import':$('#importFile').value='';$('#importFile').click();break;
    case 'confirmImport':{const d=pendingImport;if(!d)break;applyImport(d);pendingImport=null;closeSheet();UI.tab='today';render();toast('Import terminé');break;}
    case 'removeExamples':if(UI.confirm==='examples'){UI.confirm=null;removeExamples();}else{UI.confirm='examples';render();}break;
    case 'gridInit':{const pr=clone(prof(ds.id));pr.grid=defaultGrid();pr.evals=pr.evals||[];put('profiles',pr);toast('Grille créée : personnalise-la ou fais une première observation');break;}
    case 'gridEdit':gridSheet(ds.id);break;
    case 'gridSave':saveGrid();break;
    case 'gridReset':draft.sections=defaultGrid().sections;renderGridEditor();toast('Grille type rechargée (non enregistrée)');break;
    case 'evalNew':evalSheet(ds.id);break;
    case 'evalEdit':evalSheet(ds.id,ds.ev);break;
    case 'evalSave':saveEval();break;
    case 'evalHist':evalHistSheet(ds.id);break;
    case 'evalDel':if(UI.confirm==='ev_'+ds.ev){UI.confirm=null;const pr=clone(prof(ds.id));pr.evals=(pr.evals||[]).filter(e=>e.id!==ds.ev);put('profiles',pr);toast('Observation supprimée');setTimeout(()=>evalHistSheet(ds.id),0);}else{UI.confirm='ev_'+ds.ev;evalHistSheet(ds.id);}break;
    case 'openDash':UI.tab='dash';UI.dash=ds.id;closeSheet();render();window.scrollTo(0,0);break;
    case 'calCreate':makeCalToken();break;
    case 'calCopy':{const t=$('#cal_url');const v=t.value;(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Lien copié')).catch(()=>{t.focus();t.select();toast('Lien sélectionné : copie-le');});break;}
    case 'calReset':if(UI.confirm==='calreset'){UI.confirm=null;makeCalToken();}else{UI.confirm='calreset';render();}break;
    case 'signIn':case 'signUp':case 'resetPw':case 'setNewPw':case 'signOut':authAct(a);break;
    case 'closeSheet':closeSheet();break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.caltime||t.dataset.caldur){const id=t.dataset.caltime||t.dataset.caldur;const p=clone(S.plans[id]);if(!p)return;if(t.dataset.caltime)p.calTime=t.value;else p.calDur=t.value===''?'':Number(t.value);put('plans',p);toast('Heure enregistrée : l’agenda se mettra à jour');return;}
  if(t.dataset.act==='toggleCrit'){const p=clone(S.plans[t.dataset.plan]);const st=p.steps.find(s=>s.id===t.dataset.step);const c=st.criteria.find(c=>c.id===t.dataset.crit);
    if(t.checked){c.done=true;c.doneAt=today();delete c.bySession;logEntry(p,'Validé manuellement : '+c.text);}else{c.done=false;delete c.doneAt;delete c.bySession;logEntry(p,'Validation corrigée (retirée) : '+c.text);}
    put('plans',p);toast(t.checked?'Critère validé':'Validation retirée');return;}
  if(t.dataset.act==='toggleStepDone'){const p=clone(S.plans[t.dataset.plan]);const st=p.steps.find(s=>s.id===t.dataset.step);st.done=t.checked;if(t.checked)st.doneAt=today();else delete st.doneAt;logEntry(p,(t.checked?'Étape validée : ':'Validation d’étape retirée : ')+st.title);put('plans',p);return;}
  if(t.id==='tplSelect'){const T=templates()[t.value];const keep={id:draft.id,title:draft.title,subjects:draft.subjects,rotation:draft.rotation,startDate:draft.startDate,endDate:draft.endDate,description:draft.description,status:'active',pauses:[],log:[],time:draft.time};draft=Object.assign({days:[]},T.f(),keep,{_new:true,_tpl:t.value});if(!draft.title)draft.title='';renderEditor();return;}
  if(t.id==='bl_step'){document.querySelectorAll('[data-stepblock]').forEach(b=>{b.hidden=b.dataset.stepblock!==t.value;});return;}
  if(t.name==='bl_fatigue'||t.classList.contains('bl_em')||t.name==='bl_adj'){bilanHint();return;}
  if(t.dataset.set&&draft){const k=t.dataset.set;let v=t.value;if(t.dataset.int)v=Number(v);const arr=draft[k]=draft[k]||[];const i=arr.indexOf(v);if(t.checked&&i<0)arr.push(v);if(!t.checked&&i>=0)arr.splice(i,1);return;}
  if(t.dataset.bind&&draft&&t.tagName==='SELECT'){setPath(draft,t.dataset.bind,t.value);if(t.dataset.rerender)rerenderDraft();return;}
  if(t.id==='importFile'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.profiles)throw 0;pendingImport=d;const ip=importPlan(d);openSheet('Importer',`<p>Fichier : ${Object.keys(d.profiles||{}).length} profils, ${Object.keys(d.plans||{}).length} plans, ${Object.keys(d.sessions||{}).length} séances.</p>${ip.matched.length?`<p class="small">Profils déjà présents, complétés sans rien effacer : <b>${ip.matched.map(esc).join(', ')}</b>. Les champs que tu as déjà remplis sont conservés.</p>`:''}<p class="small muted">Les plans ayant le même identifiant seront remplacés, les autres ajoutés.</p>`,'<button class="btn primary" data-act="confirmImport">Importer</button>');}catch(err){toast('Fichier non reconnu : choisis un export du Carnet de Meute (.json).');}};r.readAsText(t.files[0]);}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.bindlist&&draft){setPath(draft,t.dataset.bindlist,t.value.split(',').map(x=>x.trim()).filter(Boolean));return;}if(t.dataset.bind&&draft&&t.tagName!=='SELECT'){let v=t.value;if(t.dataset.num)v=v===''?'':Number(v);setPath(draft,t.dataset.bind,v);}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='au_pw'||e.target.id==='au_email')){e.preventDefault();authAct('signIn');return;}if(e.key==='Enter'&&e.target.id==='au_new'){e.preventDefault();authAct('setNewPw');return;}if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});

render();initStore();
})();
</script>
